name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  forge:
    name: Foundry project
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [privacy-paymaster]
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Show Forge version
        run: forge --version

      - run: forge build --sizes
        working-directory: ${{ matrix.project }}

      - run: forge test -vvv
        working-directory: ${{ matrix.project }}

  js-sdk:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - run: bun install
        working-directory: privacy-paymaster/sdk

      # The e2e test forks Sepolia, so it needs the secret. Pull requests from forks get no secrets.
      - run: bun test
        if: env.SEPOLIA_RPC_URL != ''
        working-directory: privacy-paymaster/sdk

      - run: echo "::notice::SEPOLIA_RPC_URL is not set, so the SDK e2e test was skipped"
        if: env.SEPOLIA_RPC_URL == ''
